# .github/workflows/fix-formspree-url.yml
name: Replace Formspree URL (site-wide)

on:
  workflow_dispatch:
    inputs:
      old_url:
        description: 'Old Formspree URL to replace'
        required: true
        default: 'https://formspree.io/f/xzdogyvo'
      new_url:
        description: 'New Formspree URL'
        required: true
        default: 'https://formspree.io/f/myezzgya'
      dry_run:
        description: 'Dry run only (no commit/push, just show what would change)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  replace-url:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace URL across all pages
        id: replace
        run: |
          OLD="${{ github.event.inputs.old_url }}"
          NEW="${{ github.event.inputs.new_url }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          echo "## Formspree URL Replace" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Old:** \`$OLD\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **New:** \`$NEW\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dry run:** \`$DRY_RUN\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # search every real page/asset type, skip .git and node_modules
          FILES=$(grep -rlF "$OLD" \
            --include="*.html" --include="*.htm" \
            --include="*.js" --include="*.json" \
            --include="*.xml" --include="*.txt" \
            --exclude-dir=".git" --exclude-dir="node_modules" \
            . 2>/dev/null || true)

          if [ -z "$FILES" ]; then
            echo "No files contain the old URL. Nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "| File | Occurrences |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------------|" >> "$GITHUB_STEP_SUMMARY"

          TOTAL_FILES=0
          TOTAL_HITS=0

          for file in $FILES; do
            HITS=$(grep -oF "$OLD" "$file" | wc -l)
            echo "Found: $file ($HITS occurrence(s))"
            echo "| \`$file\` | $HITS |" >> "$GITHUB_STEP_SUMMARY"
            TOTAL_FILES=$((TOTAL_FILES+1))
            TOTAL_HITS=$((TOTAL_HITS+HITS))

            if [ "$DRY_RUN" != "true" ]; then
              # perl -pi is safer than sed here: treats OLD/NEW as literal strings,
              # no manual regex-escaping needed even if the URL ever has special chars
              perl -pi -e "BEGIN{binmode STDIN, ':raw'; binmode STDOUT, ':raw'} s/\Q$OLD\E/$NEW/g" "$file"
            fi
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Total: $TOTAL_HITS occurrence(s) across $TOTAL_FILES file(s).**" >> "$GITHUB_STEP_SUMMARY"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run — no files were actually modified." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # verify nothing was missed
          REMAINING=$(grep -rlF "$OLD" \
            --include="*.html" --include="*.htm" \
            --include="*.js" --include="*.json" \
            --include="*.xml" --include="*.txt" \
            --exclude-dir=".git" --exclude-dir="node_modules" \
            . 2>/dev/null || true)

          if [ -n "$REMAINING" ]; then
            echo "WARNING: old URL still present in:" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "$REMAINING" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push if changed
        if: steps.replace.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Fix: update Formspree endpoint site-wide"
          git push
